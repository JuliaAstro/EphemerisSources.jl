name: Test

#
# Content copied and modified from https://github.com/SciML/Optimization.jl
#

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/docs/**"
      - "**/paper/**"
      - "**/README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/docs/**"
      - "**/paper/**"
      - "**/README.md"
  workflow_dispatch:

jobs:
  test-subpackages:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - EphemerisSourcesBase
          - HorizonsAPI
          - HorizonsEphemeris
          - SPICEKernels
          - SPICEBodies
        version:
          - "1"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Test each subpackage directly (not via a nested `Pkg.test()` in the root tests),
      # so julia-runtest's coverage tracking reaches the subpackage's own code
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: lib/${{ matrix.group }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: lib/${{ matrix.group }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: lib/${{ matrix.group }}/src
      - uses: codecov/codecov-action@v7
        with:
          flags: ${{ matrix.group }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  test-superpackage:
    runs-on: ${{ matrix.os }}
    needs: [test-subpackages]
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build Development Environment
        run: julia --project -e 'using Pkg; Pkg.develop(PackageSpec(path = joinpath("lib", "EphemerisSourcesBase"))); Pkg.develop(PackageSpec(path = joinpath("lib", "HorizonsAPI"))); Pkg.develop(PackageSpec(path = joinpath("lib", "HorizonsEphemeris"))); Pkg.develop(PackageSpec(path = joinpath("lib", "SPICEKernels"))); Pkg.develop(PackageSpec(path = joinpath("lib", "SPICEBodies")));Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
