name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    name: TagBot ${{ matrix.subdir || 'EphemerisSources' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "" is the top-level package (tags `vX.Y.Z`); subpackages are tagged `<Package>-vX.Y.Z`
        subdir:
          - ""
          - lib/EphemerisSourcesBase
          - lib/HorizonsAPI
          - lib/HorizonsEphemeris
          - lib/SPICEBodies
          - lib/SPICEKernels
    # Back-to-back registrations trigger overlapping runs; don't let two tag the same package at once
    concurrency:
      group: tagbot-${{ matrix.subdir || 'root' }}
      cancel-in-progress: false
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: ${{ matrix.subdir }}
